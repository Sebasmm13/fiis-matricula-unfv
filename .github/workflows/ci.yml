name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fiis_matricula_test
          POSTGRES_USER: fiis
          POSTGRES_PASSWORD: fiis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fiis -d fiis_matricula_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fiis:fiis_test@127.0.0.1:5432/fiis_matricula_test
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-not-used-in-production
      DJANGO_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff format --check backend scripts
      - run: ruff check backend scripts
      - run: python backend/manage.py test core

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
